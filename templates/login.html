<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModBerry Manager - Connexion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-shell">
        <div class="login-container login-card">
            <div class="brand-mark">MM</div>
            <h1>ModBerry Manager</h1>
            <p class="subtitle">Scanner le LAN, retrouver les ModBerry, changer leur IP.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Identifiant ou email</label>
                    <input type="text" name="identity" placeholder="admin-ip@modberry.local" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="password" placeholder="Mot de passe" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
                <p class="small-muted" style="margin-top: 14px;">Compte par defaut: admin-ip / takieddine</p>
            </form>
        </div>
    </div>
</body>
</html>
